[project]
name = "assistente-pesquisa-cientifica-api"
version = "2.1.0"
description = "API FastAPI com RAG, contagem de tokens e streaming SSE usando Ollama ou OpenAI."
authors = [
    { name = "Hayverson", email = "hayversongab@outlook.com" },
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.139.0,<0.140.0",
    "uvicorn>=0.51.0,<0.52.0",
    "langchain>=0.3.26,<0.4.0",
    "langchain-community>=0.3.27,<0.4.0",
    "langchain-core>=0.3.72,<0.4.0",
    "langchain-openai>=0.3.27,<0.4.0",
    "langchain-text-splitters>=0.3.8,<0.4.0",
    "openai>=1.93.0,<2.0.0",
    "faiss-cpu>=1.11.0,<2.0.0",
    "pymupdf>=1.26.3,<2.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
    "tiktoken>=0.9.0,<1.0.0",
    "requests>=2.32.4,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
]

[project.optional-dependencies]
auto = [
    "arxiv>=2.2.0,<3.0.0",
    "fpdf>=1.7.2,<2.0.0",
    "sentence-transformers>=5.0.0,<6.0.0",
    "transformers>=4.53.0,<5.0.0",
    "torch>=2.7.1,<3.0.0",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-p no:warnings"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W"]
ignore = ["E501"]

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.taskipy.tasks]
lint = "ruff check ."
pre_format = "ruff check --fix ."
format = "ruff format ."
run = "uvicorn main:app --host 127.0.0.1 --port 8110 --reload"
demo = "python scripts/demo.py --mode both --source arxiv"
pre_test = "task lint"
test = "pytest -s -x --cov=src --cov-report=term-missing -vv"
post_test = "coverage html"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.12.0,<0.13.0",
    "taskipy>=1.14.1,<2.0.0",
]
